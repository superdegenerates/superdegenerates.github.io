<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superdegenerates VOD Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background-color: #0c0c0c; color: #ffffff; }

    /* Clean Navigation Bar - Zero Branding */
    header {
      background-color: #141414;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .site-title { font-size: 22px; font-weight: bold; color: #007bff; letter-spacing: 0.5px; }
    nav a { color: #aaaaaa; text-decoration: none; margin-left: 25px; font-size: 15px; font-weight: 500; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #ffffff; }

    /* Layout Elements Matching Your Design */
    .main-container { max-width: 1100px; margin: 50px auto; padding: 0 20px; }
    .section-title { font-size: 32px; color: #ffffff; margin-bottom: 8px; font-weight: 600; }
    .section-desc { font-size: 15px; color: #888888; margin-bottom: 40px; }

    /* Single Page Multi-VOD Grid Alignment Row */
    .show-row { display: flex; gap: 40px; margin-bottom: 60px; align-items: flex-start; background: #141414; padding: 25px; border-radius: 8px; border: 1px solid #222; }
    .show-visual { flex: 1.2; max-width: 550px; }
    .show-text-content { flex: 1; }
    .show-text-content h2 { font-size: 26px; color: #007bff; margin-bottom: 15px; font-weight: 600; }
    .show-text-content p { font-size: 15px; line-height: 1.6; color: #cccccc; }

    /* Video Player Frame Styling */
    .video-frame-container { width: 100%; aspect-ratio: 16 / 9; background-color: #000000; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <header>
    <div class="site-title">PluckerSoap Studios</div>
    <nav>
      <a href="#" class="active">Catalog</a>
    </nav>
  </header>

  <div class="main-container">
    <h2 class="section-title">The Catalog</h2>
    <p class="section-desc">All our shows, hosted independently.</p>

    <!-- VOD SECTION START: SUPERDEGENERATES -->
    <div class="show-row">
      <div class="show-visual">
        <div class="video-frame-container">
          <!-- REPLACE THE SRC LINK BELOW WITH YOUR DIRECT INTERNET ARCHIVE MP4 URL -->
          <video id="mainVideoPlayer" controls poster="https://placeholder.com">
            <source src="YOUR_DIRECT_ARCHIVE_MP4_LINK_HERE" type="video/mp4">
            Your browser does not support HTML5 video.
          </video>
        </div>
      </div>
      <div class="show-text-content">
        <h2>Superdegenerates</h2>
        <p>Explore the wacky world of Humphrey MacGovan and Earnest Humphreybottom and their friends: Nigel Squiggmore, Fantasticleese, Charles Leaplee, Joe Lotimlor, Howard Bunkcestrey and Bort Cellentigular!</p>
      </div>
    </div>
    <!-- VOD SECTION END -->

  </div>

</body>
</html>
